<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سُورَةُ ٱلْفَاتِحَةِ</title>
<link rel="icon" href="images/logo.webp">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="أَشُدَّهُمَا">
<meta name="theme-color" content="#FEF9EF">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/recite.css">
</head>
<body data-surah="fatihah">
<div class="game recite">
  <header class="top"><a href="/" aria-label="الصَّفْحَةُ الرَّئِيسِيَّةُ"><img class="logo" src="images/logo.webp" alt=""></a></header>

  <section class="view" id="view-surah">
    <h1 class="surah-title quran">سُورَةُ ٱلْفَاتِحَةِ</h1>
    <div class="modes" role="tablist" aria-label="طَرِيقَةُ الِاسْتِمَاعِ">
      <button type="button" role="tab" data-mode="surah">السُّورَةُ كَامِلَةً</button>
      <button type="button" role="tab" data-mode="ayah">آيَةً آيَةً</button>
    </div>
    <ol class="ayat quran" id="ayat"></ol>
    <div class="focus">
      <p class="ayah-focus quran" id="focus"></p>
      <p class="prompt" id="turn" hidden>الْآنَ اقْرَأْهَا أَنْتَ</p>
    </div>
    <div class="deck" id="deck">
      <button class="round deck-back" id="back" type="button" aria-label="الْآيَةُ السَّابِقَةُ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 5.5l6.5 6.5-6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="button quiet deck-again" id="again" type="button"><span aria-hidden="true">↻</span> أَعِدِ الْآيَةَ</button>
      <div class="deck-core">
        <button class="round deck-play" id="play" type="button" data-state="listen" aria-label="اِسْتَمِعْ"><svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 4.6v14.8a.9.9 0 0 0 1.37.77l11.6-7.4a.9.9 0 0 0 0-1.54L8.87 3.83A.9.9 0 0 0 7.5 4.6z" fill="currentColor"/></svg><svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4.5" width="4.2" height="15" rx="1.2" fill="currentColor"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.2" fill="currentColor"/></svg></button>
        <button class="round deck-stop" id="stop" type="button" aria-label="أَوْقِفْ"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="5.5" width="13" height="13" rx="2.2" fill="currentColor"/></svg></button>
      </div>
      <button class="round deck-forward" id="forward" type="button" aria-label="الْآيَةُ التَّالِيَةُ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 5.5L4.5 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="button deck-next" id="next" type="button">الْآيَةُ التَّالِيَةُ <span aria-hidden="true">←</span></button>
    </div>
  </section>
</div>
<script src="js/app.js"></script>
<script src="js/sound.js"></script>
<script src="js/timing.js"></script>
<script src="js/recite.js"></script>
</body>
</html>
