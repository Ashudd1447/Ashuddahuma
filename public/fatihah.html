<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سُورَةُ ٱلْفَاتِحَةِ</title>
<link rel="icon" href="images/logo.webp">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="أَشُدَّهُمَا">
<meta name="theme-color" content="#FEF9EF">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-surah="fatihah">
<div class="game recite">
  <header class="top"><a href="/" aria-label="الصَّفْحَةُ الرَّئِيسِيَّةُ"><img class="logo" src="images/logo.webp" alt=""></a></header>

  <section class="view" id="view-surah">
    <h1 class="surah-title quran">سُورَةُ ٱلْفَاتِحَةِ</h1>
    <div class="modes" role="tablist" aria-label="طَرِيقَةُ الِاسْتِمَاعِ">
      <button type="button" role="tab" data-mode="surah">السُّورَةُ كَامِلَةً</button>
      <button type="button" role="tab" data-mode="ayah">آيَةً آيَةً</button>
    </div>
    <ol class="ayat quran" id="ayat"></ol>
    <div class="focus">
      <p class="ayah-focus quran" id="focus"></p>
      <p class="prompt" id="turn" hidden>الْآنَ اقْرَأْهَا أَنْتَ</p>
    </div>
    <div class="controls" id="controls-surah">
      <button class="button" id="listen" type="button"></button>
    </div>
    <div class="controls" id="controls-ayah">
      <button class="button" id="again" type="button"><span aria-hidden="true">↻</span> أَعِدِ الْآيَةَ</button>
      <button class="button" id="next" type="button">الْآيَةُ التَّالِيَةُ <span aria-hidden="true">←</span></button>
    </div>
  </section>
</div>
<script src="js/app.js"></script>
<script src="js/sound.js"></script>
<script src="js/timing.js"></script>
<script src="js/recite.js"></script>
</body>
</html>
