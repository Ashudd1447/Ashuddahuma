<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الْمَتَاهَاتُ</title>
<link rel="icon" href="images/logo.webp">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="أَشُدَّهُمَا">
<meta name="theme-color" content="#FEF9EF">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="mazes-page">
<div class="mazes" id="mazes" data-view="list">
  <header class="head">
    <a href="games.html" aria-label="أَلْعَاب"><img class="logo" src="images/logo.webp" alt=""></a>
  </header>
  <section class="maze-list" id="view-list">
    <h1 class="hub-title">الْمَتَاهَاتُ</h1>
    <div class="maze-sections" id="cards"></div>
  </section>
  <section class="maze-play" id="view-maze" hidden>
    <div class="maze-text">
      <h1 class="maze-title" id="title"></h1>
      <p class="maze-line" id="line"></p>
    </div>
    <div class="maze-board" id="board">
      <div class="maze-paper" id="paper">
        <canvas id="canvas"></canvas>
        <i class="maze-ring" id="ring" aria-hidden="true" hidden></i>
      </div>
    </div>
    <div class="maze-after">
      <p class="maze-name" id="name" hidden></p>
      <div class="maze-buttons" id="buttons" hidden>
        <button class="round maze-next" id="next" type="button" aria-label="الْمَتَاهَةُ التَّالِيَةُ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 5.5L4.5 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="round maze-next" id="to-list" type="button" aria-label="الْمَتَاهَاتُ" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 4.5h6v6h-6zM13.5 4.5h6v6h-6zM4.5 13.5h6v6h-6zM13.5 13.5h6v6h-6z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg></button>
        <button class="round" id="again" type="button" aria-label="مَرَّةً أُخْرَى"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
  </section>
</div>
<script src="js/app.js"></script>
<script src="js/sound.js"></script>
<script src="js/mazes.js"></script>
</body>
</html>
