<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الْقِبْلَةُ</title>
<link rel="icon" href="images/logo.webp">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="أَشُدَّهُمَا">
<meta name="theme-color" content="#FEF9EF">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/salah.css">
</head>
<body class="qibla-page">
<canvas class="qb-canvas" id="scene" aria-hidden="true"></canvas>
<div class="qibla" id="qibla">
  <header class="head">
    <a href="salah.html" aria-label="الصَّلَاةُ"><img class="logo" src="images/logo.webp" alt=""></a>
  </header>
  <button class="qb-bar" id="bar" type="button">
    <span class="qb-takbir" id="takbir"></span>
    <span class="qb-words">
      <span class="qb-place" id="place"></span>
      <span class="qb-ask" id="ask"></span>
      <span class="qb-zikr" id="zikr"></span>
    </span>
  </button>
  <div class="qb-dots" id="dots" aria-hidden="true"></div>
  <div class="qb-done" id="done" hidden>
    <p class="praise">أحسنت</p>
    <div class="s-done-buttons" id="buttons" hidden>
      <a class="round s-go" id="leave" href="salah.html" aria-label="الصَّلَاةُ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 5.5L4.5 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <button class="round" id="again" type="button" aria-label="مَرَّةً أُخْرَى"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </div>
</div>
<script src="js/app.js"></script>
<script src="js/sound.js"></script>
<script src="js/salah.js"></script>
<script src="js/qibla.js"></script>
</body>
</html>
