<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قِيَادَةُ الْمَرْكَبَاتِ</title>
<link rel="icon" href="images/logo.webp">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="أَشُدَّهُمَا">
<meta name="theme-color" content="#FEF9EF">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="drive-page">
<canvas class="road-canvas" id="road" aria-hidden="true" hidden></canvas>
<div class="drive" id="drive" data-view="roads">
  <header class="head">
    <a href="games.html" aria-label="أَلْعَاب"><img class="logo" src="images/logo.webp" alt=""></a>
    <div class="score" id="score"><span id="score-star"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg></span><span id="count">٠</span></div>
  </header>

  <section class="drive-view" id="view-roads">
    <nav class="road-cards" id="road-cards"></nav>
  </section>

  <section class="drive-view" id="view-belt" hidden>
    <p class="prompt" id="belt-prompt">اِرْبِطْ حِزَامَ الْأَمَانِ</p>
    <svg class="belt-scene" id="belt" viewBox="0 0 400 400" role="img" tabindex="0" aria-label="حِزَامُ الْأَمَانِ">
      <defs>
        <linearGradient id="belt-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8CC4EA"/><stop offset="1" stop-color="#DCEFF9"/></linearGradient>
      </defs>
      <rect width="400" height="400" rx="28" fill="#E9DCC8"/>
      <rect x="18" y="26" width="128" height="150" rx="22" fill="url(#belt-sky)" stroke="#4A3424" stroke-width="5"/>
      <path d="M40 176V120q6-22 22-8 14-20 30-4 18-16 30 12v56z" fill="#5E9E45" stroke="#4A3424" stroke-width="4" stroke-linejoin="round"/>
      <rect x="318" y="0" width="64" height="400" fill="#D3C2A8"/>
      <path d="M318 0V400" stroke="#4A3424" stroke-width="5"/>
      <rect x="148" y="22" width="116" height="74" rx="24" fill="#8C6A4C" stroke="#4A3424" stroke-width="5"/>
      <rect x="196" y="92" width="20" height="26" fill="#6E533B" stroke="#4A3424" stroke-width="4"/>
      <rect x="106" y="110" width="200" height="206" rx="34" fill="#A9825E" stroke="#4A3424" stroke-width="5"/>
      <path d="M150 130V296M262 130V296" stroke="#8C6A4C" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 14"/>
      <rect x="82" y="298" width="248" height="74" rx="30" fill="#A9825E" stroke="#4A3424" stroke-width="5"/>
      <path d="M112 334H300" stroke="#8C6A4C" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 14"/>
      <g id="belt-buckle">
        <rect x="76" y="296" width="20" height="58" rx="6" fill="#3A3A3A" stroke="#4A3424" stroke-width="3"/>
        <rect x="58" y="266" width="56" height="44" rx="10" fill="#C0392B" stroke="#4A3424" stroke-width="4"/>
        <rect x="70" y="280" width="32" height="8" rx="4" fill="#2B1F16"/>
        <circle id="belt-glow" cx="86" cy="288" r="40" fill="none" stroke="#F2B84B" stroke-width="6"/>
      </g>
      <circle cx="350" cy="64" r="15" fill="#6B6B6B" stroke="#4A3424" stroke-width="4"/>
      <circle cx="350" cy="346" r="13" fill="#6B6B6B" stroke="#4A3424" stroke-width="4"/>
      <path id="belt-lap" d="" fill="none" stroke="#3A3A3A" stroke-width="20" stroke-linecap="round"/>
      <path id="belt-strap" d="" fill="none" stroke="#3A3A3A" stroke-width="20" stroke-linecap="round"/>
      <path id="belt-strap-line" d="" fill="none" stroke="#5A5A5A" stroke-width="3" stroke-dasharray="1 9" stroke-linecap="round"/>
      <g id="belt-tongue">
        <circle r="46" fill="transparent"/>
        <rect x="-21" y="-17" width="42" height="34" rx="8" fill="#3A3A3A" stroke="#2B1F16" stroke-width="3"/>
        <rect x="-36" y="-11" width="24" height="22" rx="5" fill="#D9DCE0" stroke="#4A3424" stroke-width="3"/>
        <rect x="-31" y="-4" width="10" height="8" rx="2" fill="#8D949B"/>
      </g>
    </svg>
  </section>

  <section class="drive-view" id="view-dua" hidden>
    <div class="dua" id="dua"></div>
    <button class="go" id="go" type="button" aria-label="اِنْطَلِقْ" hidden><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="18" fill="none" stroke="currentColor" stroke-width="5"/><circle cx="24" cy="24" r="5" fill="currentColor"/><path d="M24 29V42M19.5 22L7 18M28.5 22L41 18" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg></button>
  </section>

  <section class="drive-view" id="view-trip" hidden>
    <div class="trip" id="trip" aria-hidden="true"><i class="trip-fill" id="trip-fill"></i><i class="trip-car" id="trip-car"></i><img class="trip-goal" id="trip-goal" alt=""></div>
    <p class="zikr" id="zikr" hidden></p>
    <div class="wheel" id="wheel" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="18" fill="none" stroke="currentColor" stroke-width="5"/><circle cx="24" cy="24" r="5" fill="currentColor"/><path d="M24 29V42M19.5 22L7 18M28.5 22L41 18" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg></div>
    <div class="finger-hint" id="finger-hint" aria-hidden="true" hidden><svg viewBox="0 0 48 48"><path d="M20 26V9a4 4 0 0 1 8 0v13l8 2a5 5 0 0 1 4 6l-2 9a6 6 0 0 1-6 5H22a6 6 0 0 1-5-3l-7-11a3.5 3.5 0 0 1 5-5z" fill="#FFFDF6" stroke="#4A3424" stroke-width="3" stroke-linejoin="round"/></svg></div>
    <button class="pedal pedal-a" type="button" data-pedal aria-label="أَسْرِعْ"><svg viewBox="0 0 48 48" aria-hidden="true"><path class="pedal-go" d="M24 8L40 28H30V40H18V28H8z"/><path class="pedal-stop" d="M14 24V12a3 3 0 0 1 6 0v-3a3 3 0 0 1 6 0v3a3 3 0 0 1 6 0v6a3 3 0 0 1 6 0v12a12 12 0 0 1-12 12h-3a11 11 0 0 1-9-5l-7-11a3 3 0 0 1 5-3z"/></svg></button>
    <button class="pedal pedal-b" type="button" data-pedal aria-label="أَسْرِعْ"><svg viewBox="0 0 48 48" aria-hidden="true"><path class="pedal-go" d="M24 8L40 28H30V40H18V28H8z"/><path class="pedal-stop" d="M14 24V12a3 3 0 0 1 6 0v-3a3 3 0 0 1 6 0v3a3 3 0 0 1 6 0v6a3 3 0 0 1 6 0v12a12 12 0 0 1-12 12h-3a11 11 0 0 1-9-5l-7-11a3 3 0 0 1 5-3z"/></svg></button>
  </section>

  <section class="drive-view" id="view-arrived" hidden>
    <p class="praise arrived-name" id="arrived-name"></p>
    <p class="arrived-text">الْحَمْدُ لِلَّهِ</p>
    <div class="arrived-stars" id="arrived-stars" aria-hidden="true"></div>
    <div class="controls" id="arrived-controls" hidden>
      <button class="round" id="again" type="button" aria-label="مَرَّةً أُخْرَى"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="round" id="to-roads" type="button" aria-label="الطُّرُقُ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3L5 21M15 3l4 18M12 4v3M12 10.5v3M12 17v3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    </div>
  </section>
</div>
<script src="js/app.js"></script>
<script src="js/sound.js"></script>
<script src="js/timing.js"></script>
<script src="js/drive.js"></script>
<script src="js/chase.js"></script>
<script src="js/desert.js"></script>
</body>
</html>
