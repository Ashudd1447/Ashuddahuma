<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أَيْنَ؟</title>
<link rel="icon" href="images/logo.webp">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="أَشُدَّهُمَا">
<meta name="theme-color" content="#FEF9EF">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/where.css">
</head>
<body class="where">
<div class="game">
  <header class="top"><a href="arabic.html" aria-label="اللُّغَةُ الْعَرَبِيَّةُ"><img class="logo" src="images/logo.webp" alt=""></a></header>

  <section class="view" id="view-list">
    <h1 class="hub-title">أَيْنَ؟</h1>
    <nav class="w-stages" id="stages"></nav>
  </section>

  <section class="view w-play" id="view-play" hidden>
    <div class="dots w-dots" id="dots" aria-hidden="true"></div>
    <p class="w-head" id="head"></p>
    <div class="w-room" id="room"><div class="w-stage" id="stage"></div></div>
    <p class="w-line" id="line"></p>
    <div class="w-choices" id="choices"></div>
    <div class="w-controls" id="controls">
      <button class="w-round w-back" id="back" type="button" aria-label="السَّابِقُ" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13.5M13 5.5l6.5 6.5-6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="w-round" id="again" type="button" aria-label="اِسْتَمِعْ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.3 6a8.6 8.6 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <button class="w-round w-next" id="next" type="button" aria-label="التَّالِي"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5.5M11 5.5L4.5 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </section>

  <section class="view" id="view-done" hidden>
    <p class="praise" id="praise">أحسنت</p>
    <div class="w-done-words" id="done-words"></div>
    <div class="w-done-buttons">
      <button class="button" id="go-on" type="button">التَّالِي <span aria-hidden="true">←</span></button>
      <button class="button quiet" id="to-list" type="button">أَيْنَ؟</button>
    </div>
  </section>
</div>
<script src="js/app.js"></script>
<script src="js/sound.js"></script>
<script src="js/where-words.js"></script>
<script src="js/where.js"></script>
</body>
</html>
