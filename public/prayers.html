<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الصَّلَوَاتُ الْخَمْسُ</title>
<link rel="icon" href="images/logo.webp">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="أَشُدَّهُمَا">
<meta name="theme-color" content="#FEF9EF">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/prayers.css">
</head>
<body class="prayers-page">
<!-- The five small skies, one for each time of day: the same town under the dawn's glow, the high sun, the low sun,
     the sun going down and the moon. East is on the right, as in the pictures, so the sun crosses from right to left;
     a crescent's lit side faces where the sun is: the dawn on the right before sunrise, the west on the left at night. -->
<svg class="pr-sprite" aria-hidden="true" focusable="false">
  <defs>
    <clipPath id="pr-round"><circle cx="16" cy="16" r="16"/></clipPath>
    <linearGradient id="pr-sky-fajr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22386F"/><stop offset=".5" stop-color="#4F5B9B"/><stop offset=".8" stop-color="#B98CA5"/><stop offset="1" stop-color="#F2B79E"/></linearGradient>
    <radialGradient id="pr-glow-fajr" gradientUnits="userSpaceOnUse" cx="27" cy="24.5" r="14"><stop offset="0" stop-color="#FFEFC4"/><stop offset="1" stop-color="#FFEFC4" stop-opacity="0"/></radialGradient>
    <linearGradient id="pr-sky-dhuhr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#64ADE8"/><stop offset="1" stop-color="#DCEFFB"/></linearGradient>
    <linearGradient id="pr-sky-asr" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3C7CBD"/><stop offset=".6" stop-color="#8FB8D6"/><stop offset="1" stop-color="#F8E0A2"/></linearGradient>
    <linearGradient id="pr-sky-maghrib" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#54478C"/><stop offset=".45" stop-color="#D95B6A"/><stop offset=".8" stop-color="#F6914B"/><stop offset="1" stop-color="#FBC05E"/></linearGradient>
    <linearGradient id="pr-sky-isha" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E1840"/><stop offset="1" stop-color="#2A3C78"/></linearGradient>
    <!-- The ground, with the masjid on it: its hall, its dome and its minaret -->
    <g id="pr-land">
      <path d="M2.44 24.5A16 16 0 0 0 29.56 24.5z"/>
      <path d="M9.6 25v-2.4h8.8V25z"/>
      <path d="M11 22.7a3 3 0 0 1 6 0z"/>
      <path d="M13.7 18.6h.6v1.3h-.6z"/>
      <path d="M19.6 25v-9.2h1.6V25z"/>
      <path d="M19.4 15.9l1-1.9 1 1.9z"/>
      <path d="M19.1 17.5h2.6v.8h-2.6z"/>
    </g>
    <g id="pr-fajr" clip-path="url(#pr-round)">
      <circle cx="16" cy="16" r="16" fill="url(#pr-sky-fajr)"/>
      <circle cx="16" cy="16" r="16" fill="url(#pr-glow-fajr)"/>
      <path d="M13.84 6.54A3.4 3.4 0 1 0 13.84 11.46A2.72 2.72 0 1 1 13.84 6.54z" transform="rotate(-145 11.5 9)" fill="#F5F1DF"/>
      <g fill="#FFF0B8"><circle cx="21" cy="6.5" r=".6"/><circle cx="6.5" cy="13" r=".5"/></g>
      <use href="#pr-land" fill="#33426B"/>
      <circle cx="20.4" cy="17.1" r=".7" fill="#FFD86B"/>
    </g>
    <g id="pr-dhuhr" clip-path="url(#pr-round)">
      <circle cx="16" cy="16" r="16" fill="url(#pr-sky-dhuhr)"/>
      <circle cx="16" cy="9.5" r="7.2" fill="#FFFFFF" opacity=".5"/>
      <circle cx="16" cy="9.5" r="4.6" fill="#FFD43B" stroke="#F5A623" stroke-width=".8"/>
      <use href="#pr-land" fill="#D29A55"/>
    </g>
    <g id="pr-asr" clip-path="url(#pr-round)">
      <circle cx="16" cy="16" r="16" fill="url(#pr-sky-asr)"/>
      <circle cx="8.5" cy="16" r="6.6" fill="#FFFFFF" opacity=".4"/>
      <circle cx="8.5" cy="16" r="4.2" fill="#FDB93A" stroke="#EE9422" stroke-width=".8"/>
      <use href="#pr-land" fill="#C2853F"/>
    </g>
    <g id="pr-maghrib" clip-path="url(#pr-round)">
      <circle cx="16" cy="16" r="16" fill="url(#pr-sky-maghrib)"/>
      <circle cx="9.5" cy="24.5" r="8.4" fill="#FDBB5B" opacity=".5"/>
      <circle cx="9.5" cy="24.5" r="6" fill="#F2622E"/>
      <use href="#pr-land" fill="#5A342B"/>
    </g>
    <g id="pr-isha" clip-path="url(#pr-round)">
      <circle cx="16" cy="16" r="16" fill="url(#pr-sky-isha)"/>
      <path d="M20.95 6.38A5 5 0 1 0 20.95 13.62A4 4 0 1 1 20.95 6.38z" transform="rotate(-35 17.5 10)" fill="#F5F1DF"/>
      <g fill="#FFF0B8"><circle cx="7" cy="8.5" r=".8"/><circle cx="10.5" cy="15" r=".6"/><circle cx="26" cy="8" r=".7"/><circle cx="25" cy="16.5" r=".6"/><circle cx="12.5" cy="4.5" r=".5"/></g>
      <use href="#pr-land" fill="#18223F"/>
      <path d="M13.3 25v-1.5a.7.7 0 0 1 1.4 0V25z" fill="#FFD86B"/>
      <circle cx="20.4" cy="17.1" r=".7" fill="#FFD86B"/>
    </g>
  </defs>
</svg>
<div class="prayers" id="prayers" data-view="parts">
  <header class="head">
    <a href="salah.html" aria-label="الصَّلَاةُ"><img class="logo" src="images/logo.webp" alt=""></a>
  </header>

  <!-- The three parts, each a large card -->
  <section class="pr-parts" id="pr-view-parts">
    <h1 class="hub-title">الصَّلَوَاتُ الْخَمْسُ</h1>
    <div class="pr-cards">
      <button class="pr-card" type="button" data-part="day">
        <span class="pr-art pr-art-day" aria-hidden="true"><i data-time="fajr"></i><i data-time="dhuhr"></i><i data-time="asr"></i><i data-time="maghrib"></i><i data-time="isha"></i></span>
        <span class="pr-card-name">الْيَوْمُ وَصَلَوَاتُهُ</span>
        <span class="pr-star" aria-hidden="true" hidden><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg></span>
      </button>
      <button class="pr-card" type="button" data-part="which">
        <span class="pr-art" aria-hidden="true"><span class="pr-art-box pr-art-which">
          <span class="pr-art-pill"><svg viewBox="0 0 24 24"><path d="M3.5 9.2h3.6L12 5v14l-4.9-4.2H3.5z" fill="currentColor"/><path d="M15.3 8.8a4.3 4.3 0 0 1 0 6.4M17.9 6.2a8 8 0 0 1 0 11.6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><b>؟</b></span>
          <span class="pr-art-row" id="art-which"></span>
        </span></span>
        <span class="pr-card-name">أَيُّ صَلَاةٍ؟</span>
        <span class="pr-star" aria-hidden="true" hidden><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg></span>
      </button>
      <button class="pr-card" type="button" data-part="next">
        <span class="pr-art" aria-hidden="true"><span class="pr-art-box pr-art-next">
          <span class="pr-art-from" id="art-next"></span>
          <svg viewBox="0 0 24 24"><path d="M19 12H5M11 5.5L4.5 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <b>؟</b>
        </span></span>
        <span class="pr-card-name">مَاذَا بَعْدُ؟</span>
        <span class="pr-star" aria-hidden="true" hidden><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg></span>
      </button>
    </div>
  </section>

  <!-- 1. The day and its prayers: a picture book of the five times -->
  <section class="pr-day" id="pr-view-day" hidden>
    <div class="pr-stage">
      <div class="pr-scene" id="day-scene"></div>
      <div class="pr-words">
        <button class="pr-name" id="day-name" type="button"></button>
        <button class="pr-time" id="day-time" type="button"></button>
      </div>
    </div>
    <div class="pr-marks" id="day-marks" aria-hidden="true"></div>
    <nav class="pr-nav">
      <button class="round" id="day-back" type="button" aria-label="السَّابِقُ" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 5.5l6.5 6.5-6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="round" id="day-again" type="button" aria-label="اِسْتَمِعْ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 9.2h3.6L12 5v14l-4.9-4.2H3.5z" fill="currentColor"/><path d="M15.3 8.8a4.3 4.3 0 0 1 0 6.4M17.9 6.2a8 8 0 0 1 0 11.6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
      <button class="round pr-forward" id="day-forward" type="button" aria-label="التَّالِي"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 5.5L4.5 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </nav>
  </section>

  <!-- 2. Which prayer? A name is said; he taps the picture of its time -->
  <section class="pr-quiz pr-which" id="pr-view-which" hidden>
    <div class="pr-asked">
      <button class="pr-ask" id="which-name" type="button"><svg class="pr-ear" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 9.2h3.6L12 5v14l-4.9-4.2H3.5z" fill="currentColor"/><path d="M15.3 8.8a4.3 4.3 0 0 1 0 6.4M17.9 6.2a8 8 0 0 1 0 11.6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span id="which-text"></span></button>
      <p class="pr-time pr-answer" id="which-time"></p>
    </div>
    <div class="pr-choices" id="which-choices"><div class="pr-tiles" id="which-tiles"></div></div>
    <div class="pr-dots" id="which-dots" aria-hidden="true"></div>
  </section>

  <!-- 3. What comes next? The time he has reached, and the pictures to choose the next from -->
  <section class="pr-quiz pr-follow" id="pr-view-next" hidden>
    <div class="pr-reached">
      <span class="pr-reached-pic" id="next-pic"></span>
      <button class="pr-reached-name" id="next-name" type="button"></button>
    </div>
    <button class="pr-ask" id="next-ask" type="button"></button>
    <div class="pr-choices" id="next-choices"><div class="pr-tiles" id="next-tiles"></div></div>
    <div class="pr-marks" id="next-marks" aria-hidden="true"></div>
  </section>

  <section class="pr-done" id="pr-view-done" hidden>
    <p class="praise">أحسنت</p>
  </section>
</div>
<script src="js/app.js"></script>
<script src="js/sound.js"></script>
<script src="js/prayers.js"></script>
</body>
</html>
